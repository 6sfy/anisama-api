<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page introuvable | anisama</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0a0a0a;--panel:#111;--text:#f3f3f3;--muted:#8b8b8b;--accent:#ff4500;--border:#232323}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 50% -20%,rgba(255,69,0,.18),transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(620px,100%);padding:clamp(28px,6vw,56px);text-align:center;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(255,69,0,.35);border-radius:999px;background:rgba(255,69,0,.08);color:#ff8a5c;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
h1{margin:18px 0 8px;font-size:clamp(64px,18vw,120px);line-height:.9;letter-spacing:-.06em;background:linear-gradient(180deg,#fff 30%,#ff4500);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 12px;font-size:clamp(20px,4vw,28px)}
p{max-width:44ch;margin:0 auto 26px;color:var(--muted);line-height:1.65}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;transition:transform .15s ease,background .15s ease}
a:hover{transform:translateY(-1px)}
.primary{background:var(--accent);color:#fff}
.primary:hover{background:#ff5c1a}
.ghost{border:1px solid var(--border);background:#161616;color:var(--text)}
.ghost:hover{background:#1d1d1d}
.host{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);color:#666;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
<body>
<main class="card">
<span class="badge">Erreur 404</span>
<h1>404</h1>
<h2>Cette page n'existe pas</h2>
<p>L'adresse est peut-être mal orthographiée, ou la page a été déplacée. Vérifiez l'URL puis réessayez.</p>
<div class="actions">
<a class="primary" href="/">Retour à la documentation</a>
<a class="ghost" href="/#/quick">Guide de démarrage</a>
</div>
<p class="host">anisama.sexcaller.lol</p>
</main>
</body>
</html>
